# Nightly Storage backup (KCDX-053).
#
# Runs on GitHub Actions rather than a Vercel cron on purpose: KCDX-039 showed
# both Vercel cron routes had been silently redirected to a login page for their
# entire lives while the scheduler reported healthy runs. This job either
# succeeds or turns the workflow red, and a red workflow is visible.
name: storage-backup

on:
  schedule:
    - cron: "40 9 * * *"   # 09:40 UTC ≈ 02:40 Los Angeles, after the DB backup
  workflow_dispatch: {}     # so a drill can run it on demand

concurrency:
  group: storage-backup
  cancel-in-progress: false   # never interrupt a backup half-written

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install rclone and psql
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq rclone postgresql-client

      - name: Write rclone config
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
        run: |
          # The whole rclone.conf lives in one secret: it holds the Supabase S3
          # keys, the R2 keys and the crypt password, and splitting them across
          # four secrets makes rotation a four-step job people do partially.
          mkdir -p ~/.config/rclone
          printf '%s' "$RCLONE_CONF" > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf

      - name: Back up
        env:
          PGURI: ${{ secrets.SUPABASE_DB_URI }}
          RCLONE_SRC: supa
          DST_A: r2:klimr-backup
          DST_A_ENC: "r2enc:"
          DST_B: b2:klimr-backup
          DST_B_ENC: "b2enc:"
          
        run: bash supabase/harness/storage-backup.sh
